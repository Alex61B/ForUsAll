default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: employee_time_off_development

test:
  <<: *default
  database: employee_time_off_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
